# Local development database (WP-19). Matches the defaults in src/main/resources/application.yaml.
#   docker compose -f docker-compose.dev.yml up -d
# Then run the app from the IDE or with ./mvnw spring-boot:run, and the frontend with: cd frontend && npm run dev
name: financeflow-dev

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: financeflow
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: financeflow # local dev only, never used in production
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - dev-db-data:/var/lib/postgresql

volumes:
  dev-db-data:
