# FinanceFlow production-like stack (ADR-0006, c4-container.md): app + own PostgreSQL + backup sidecar.
# All configuration via .env (copy .env.example). Build the jar first: ./mvnw -B verify
name: financeflow

services:
  app:
    build: .
    image: financeflow:${FINANCEFLOW_VERSION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # ADR-0007: before every app start the sidecar takes and checks a dump. Wired in WP-32.
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_OWNER_USER: ${POSTGRES_USER}
      DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD}
      # JAVA_TOOL_OPTIONS: override the JVM flags from the Dockerfile if the memory measurement requires it
    ports:
      - "${APP_PORT:-8080}:8080" # plain HTTP on the LAN; remote access only via VPN (C-9, c4-container.md)
    volumes:
      - ${BACKUP_DIR}:/backups:ro # the app only reads backup status (ADR-0007 §5)
    mem_limit: 280m # ADR-0006: app + backup sidecar <= 300 MB

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/
      - db-data:/var/lib/postgresql
    # No ports: only the app and the backup job reach the database (c4-container.md)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 5

  backup:
    # Placeholder for the backup sidecar (ADR-0007, implemented in WP-32): nightly pg_dump + restore check.
    # Same image as the database so pg_dump/pg_restore match the server's major version.
    image: postgres:18.6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 'backup sidecar: not implemented yet (WP-32)'; exec sleep infinity"]
    volumes:
      - ${BACKUP_DIR}:/backups
    mem_limit: 20m

volumes:
  db-data:
